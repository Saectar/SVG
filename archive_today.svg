<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tarro de cristal con un globo terráqueo en su interior">
  <title>Tarro de cristal con globo terráqueo</title>
  <desc>Icono vectorial redibujado con trazados, sin imágenes incrustadas.</desc>
  <defs>
    <linearGradient id="globe" gradientUnits="userSpaceOnUse" x1="171.0" y1="225.0" x2="346.5" y2="297.0">
      <stop offset="0" stop-color="#73FF72"/>
      <stop offset="0.55" stop-color="#78FFB4"/>
      <stop offset="1" stop-color="#7DFFFF"/>
    </linearGradient>

    <linearGradient id="glassEdge" gradientUnits="userSpaceOnUse" x1="0" y1="135.0" x2="0" y2="432.0">
      <stop offset="0" stop-color="#ADADAD" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ADADAD"/>
      <stop offset="0.83" stop-color="#ADADAD"/>
      <stop offset="1" stop-color="#ADADAD" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomArc" gradientUnits="userSpaceOnUse" x1="128.7" y1="0" x2="364.5" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#6E6E6E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <clipPath id="globeClip">
      <circle cx="255.6" cy="279.0" r="122.4"/>
    </clipPath>
  </defs>

  <!-- ================= CUERPO DEL TARRO ================= -->
  <path d="M 103.5 122.4
           L 103.5 444.6
           Q 103.5 469.8 128.7 469.8
           L 384.3 469.8
           Q 409.5 469.8 409.5 444.6
           L 409.5 122.4"
        fill="#FFFFFF" stroke="#000000" stroke-width="9.45" stroke-linejoin="round"/>

  <!-- espesor del cristal -->
  <line x1="112.5" y1="138.6" x2="112.5" y2="424.8"
        stroke="url(#glassEdge)" stroke-width="7.2" stroke-linecap="round"/>
  <line x1="400.5" y1="138.6" x2="400.5" y2="424.8"
        stroke="url(#glassEdge)" stroke-width="7.2" stroke-linecap="round"/>

  <!-- fondo interior del tarro -->
  <path d="M 128.7 441.45 Q 255.6 388.35 364.5 441.45"
        fill="none" stroke="url(#bottomArc)" stroke-width="7.2" stroke-linecap="round"/>

  <!-- ================= GLOBO TERRAQUEO ================= -->
  <circle cx="255.6" cy="279.0" r="122.4" fill="url(#globe)"/>

  <g clip-path="url(#globeClip)" fill="none" stroke="#000000" stroke-width="8.1" stroke-linecap="round">
    <!-- paralelos -->
    <line x1="122.4" y1="216.9" x2="381.6" y2="216.9"/>
    <line x1="122.4" y1="336.6" x2="381.6" y2="336.6"/>
    <!-- ecuador -->
    <line x1="122.4" y1="279.0" x2="381.6" y2="279.0"/>
    <!-- meridianos -->
    <ellipse cx="255.6" cy="279.0" rx="54.0" ry="122.4"/>
  </g>

  <circle cx="255.6" cy="279.0" r="122.4" fill="none" stroke="#000000" stroke-width="11.25"/>

  <!-- ================= TAPA CON CIERRE DE ALAMBRE ================= -->
  <path d="M 423.9 116.1 L 450.0 141.3 L 476.1 172.8"
        fill="none" stroke="#000000" stroke-width="7.65" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="101.7" y="39.15" width="306.0" height="87.3"
        rx="7.2" ry="7.2" fill="#FFFFFF" stroke="#000000" stroke-width="9.45"/>

  <line x1="106.65" y1="57.6" x2="402.75" y2="57.6" stroke="#000000" stroke-width="8.1"/>
  <line x1="106.65" y1="85.5" x2="402.75" y2="85.5" stroke="#000000" stroke-width="8.1"/>

  <ellipse cx="88.65" cy="85.05" rx="12.6" ry="33.3"
           fill="none" stroke="#000000" stroke-width="8.1"/>
  <ellipse cx="417.15" cy="85.05" rx="12.6" ry="33.3"
           fill="none" stroke="#000000" stroke-width="8.1"/>
</svg>
